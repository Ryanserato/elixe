name: Build Elixe Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Run Gradle build
        run: |
          chmod +x gradlew
          ./gradlew setupDecompWorkspace
          ./gradlew eclipse
          ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: elixe-jar
          path: build/libs/*.jar
